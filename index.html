@font-face{font-family:'Escoredream';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_six@1.2/S-CoreDream-4Regular.woff') format('woff');font-weight:400;font-display:swap}
@font-face{font-family:'Escoredream';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_six@1.2/S-CoreDream-5Medium.woff') format('woff');font-weight:500;font-display:swap}

@font-face{font-family:'Escoredream';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_six@1.2/S-CoreDream-7ExtraBold.woff') format('woff');font-weight:700;font-display:swap}
@font-face{font-family:'Escoredream';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_six@1.2/S-CoreDream-8Heavy.woff') format('woff');font-weight:800;font-display:swap}
@font-face{font-family:'Escoredream';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_six@1.2/S-CoreDream-9Black.woff') format('woff');font-weight:900;font-display:swap}
@font-face{font-family:'PerpetualSnow';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2508-2@1.0/PermanentSnow.woff2') format('woff2');font-weight:normal;font-display:swap}
@font-face{font-family:'Ridibatang';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_twelve@1.0/RIDIBatang.woff') format('woff');font-weight:normal;font-display:swap}
@font-face{font-family:'ChosunIlboMyungjo';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_one@1.0/Chosunilbo_myungjo.woff') format('woff');font-weight:normal;font-display:swap}
@font-face{font-family:'OngleipKonkon';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2412-1@1.0/Ownglyph_corncorn-Rg.woff2') format('woff2');font-weight:normal;font-display:swap}

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{
  --ink:#1c1d20;
  --muted:#8a8f97;
  --line:#ececed;
  --panel:#ffffff;
  --desk:#f4f4f3;
  --accent:#1c1d20;
  --accent-soft:#f0f0ef;
  --tabline:#cfd0d2;
  --r:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--panel);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  font-size:11px;
  line-height:1.5;
  -webkit-text-size-adjust:100%;
  padding-bottom:20px;
}
button,select,input{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
:focus{outline:none}
input[type=text]:focus,textarea:focus,select:focus{border-color:var(--ink)}
.stepper input:focus,#hexInput:focus{outline:none}

/* ── 상단 바 ───────────────────────────── */
.topbar{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;justify-content:space-between;
  gap:10px;padding:10px 14px;
  background:var(--panel);
  border-bottom:1px solid var(--line);
}
.topbtns{display:flex;gap:8px}
.topbtns .btn,#fitBtn{height:32px;display:inline-flex;align-items:center}
#fitBtn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.topbtns #copyBtn{background:#ececed;border-color:#ececed;color:var(--ink)}
.topbtns #splitBtn{background:#bdbfc2;border-color:#bdbfc2;color:var(--ink)}
.popover{
  position:absolute;top:calc(100% + 8px);left:0;z-index:50;
  width:238px;padding:12px;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;
  box-shadow:0 12px 30px -12px rgba(16,24,40,.32);
  display:flex;flex-direction:column;gap:12px;
}
.popover[hidden]{display:none}
.poprow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.poprow > span{color:var(--muted)}
.poprow input[type=text]{flex:1;text-align:right}
.btn{
  border:1px solid var(--line);background:var(--panel);
  border-radius:9px;padding:7px 13px;font-weight:600;
}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}

/* ── 미리보기 작업대 ───────────────────── */
.stage{
  padding:52px 14px 52px;
  background:var(--desk);
  overflow-x:auto;
  overflow-y:hidden;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
.stage::-webkit-scrollbar{display:none}
.fitwrap{width:max-content;margin:0 auto}
.card{
  width:var(--w,440px);
  margin:0 auto;
  background:var(--bg,#ffffff);
  color:var(--fg,#1a1a1a);
  border-radius:0;
  box-shadow:0 1px 1px rgba(16,24,40,.04),0 10px 30px -18px rgba(16,24,40,.28);
  overflow:hidden;
}
.card .inner{
  display:flex;flex-direction:column;
  min-height:100%;
  padding:var(--py,40px) var(--px,34px);
  font-family:var(--ff,inherit);
  font-size:var(--fs,15px);
  line-height:var(--lh,1.8);
  letter-spacing:var(--ls,0px);
  text-align:var(--ta,left);
  word-break:var(--wb,keep-all);
  overflow-wrap:break-word;
  font-synthesis:weight style;
  -webkit-font-synthesis:weight style;
}
.card.fixed .inner{justify-content:center}
.card .ttl{font-size:var(--tfs,29px);font-weight:var(--tfw,700);line-height:1.32;margin-bottom:var(--gapt,15px);letter-spacing:-.01em}
.card .sub{font-size:var(--sfs,18px);font-weight:var(--sfw,500);opacity:.7;line-height:1.45;margin-bottom:var(--gaps,20px)}
.card .bdy div,.card .bdy p{margin:0 0 var(--pg,14px)}
.card .bdy div:last-child,.card .bdy p:last-child{margin-bottom:0}
.card.hscaled .ttl,.card.hscaled .sub,.card.hscaled .bdy,.card.hscaled .src{
  transform:scaleX(calc(var(--hs,100) / 100));
  transform-origin:left center;
  width:calc(10000% / var(--hs,100));
}
.card .bdy{font-weight:var(--bfw,400)}
.card .src{margin-top:var(--srcgap,20px);font-size:.72em;opacity:.6;letter-spacing:.02em}
.card .empty{display:none}
.hint{
  max-width:520px;margin:0 auto;padding:6px 14px 0;
  font-size:9px;color:#a4551a;text-align:center;
}
.hint[hidden]{display:none}

/* ── 설정 패널 ─────────────────────────── */
/* ── 탭바 ── */
.tabbar{
  position:sticky;top:0;z-index:20;
  display:flex;
  background:var(--panel);
  border-bottom:1px solid var(--line);
}
.tab{
  flex:1 1 0;min-width:0;
  border:0;background:none;color:var(--muted);
  padding:17px 4px;font-size:12px;font-weight:600;
  position:relative;
}
.tab[aria-selected=true]{color:var(--ink)}
.tab[aria-selected=true]::after{
  content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;
  background:var(--ink);
}
.panels{padding:0;display:flex;flex-direction:column;gap:10px;background:var(--panel)}
.tabpanel{background:var(--panel)}
.tabpanel[hidden]{display:none}
.pbody{padding:16px 14px;display:flex;flex-direction:column;gap:14px}
.tailico{width:24px;height:18px;display:block}
.tailico .tb{fill:var(--uimlbg,#fff);stroke:var(--uimlst,#b9bbbf);stroke-width:1}
#tailSeg button{padding:0 6px;display:inline-flex;align-items:center;justify-content:center}
.modal.narrow{max-width:214px}
.photorow{display:flex;align-items:flex-start;gap:10px}
.photobtns{flex:0 0 auto;display:flex;flex-direction:column;gap:8px}
.photobtns .savesq{font-size:0}
.photobtns .savesq svg{width:15px;height:15px}
#photoReset svg{width:13.5px;height:13.5px}
#photoSave svg{width:16.5px;height:16.5px}
.cropbox{
  position:relative;flex:0 0 auto;width:130px;height:130px;border-radius:14px;overflow:hidden;
  background:#eceef0;touch-action:none;cursor:grab;
}
.cropbox img{position:absolute;left:50%;top:50%;will-change:transform}
.memphoto,.msgphoto2{position:relative;overflow:hidden}
.memphoto img,.msgphoto2 img{position:absolute;left:50%;top:50%}
.mtbtns{display:flex;gap:6px;justify-content:flex-end}
.modal.mtwide{max-width:264px}
#mtModal .hexrow{padding:0 11px}
.linkbtn.accent{color:var(--accent);font-weight:700}
.mtchips{
  display:flex;margin-top:11px;height:30px;overflow:hidden;
  border:1px solid var(--line);border-radius:9px;background:var(--panel);
}
.mtchips i{display:block;flex:1;min-width:0}
/* 대화 ─ 멤버 */
#tab-bubble > .pbody{gap:10px}
#tab-bubble > .pbody > .subfold{margin-bottom:4px}
#tab-bubble > .pbody > .grid2{margin-top:-3px;row-gap:1px}
#tab-bubble > .pbody > .memhead-row{margin-top:-2px}
.memhead-row{display:flex;align-items:center;justify-content:space-between;gap:12px}

.memhead-row > span{font-size:10px;color:var(--muted)}
.memlist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.memcard{border:1px solid var(--line);border-radius:11px;background:#fafafa;padding:8px;min-width:0;overflow:hidden}
.memtop{display:flex;align-items:center;gap:4px;margin-bottom:6px}
.memtop input[type=text]{flex:1;min-width:0;height:26px;padding:0 7px}
.memphoto{flex:0 0 auto;width:26px;height:26px;border-radius:6px;background:#e4e6e9;border:1px solid rgba(0,0,0,.12);background-size:cover;background-position:center}
.btn.ico{width:26px;height:26px;padding:0;display:inline-flex;align-items:center;justify-content:center;font-size:11px;line-height:1;flex:0 0 auto}
.btn.ico.del{font-size:9px}
.btn.small{height:24px;padding:0 10px;display:inline-flex;align-items:center;font-size:10px}
.memcolors{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}
.memc{
  min-width:0;height:26px;padding:0;
  border:1px solid rgba(0,0,0,.13);border-radius:7px;background:var(--panel);
  box-shadow:inset 0 1px 2px rgba(16,24,40,.06);
}
.memc:active{transform:translateY(1px)}

.popover.memberpop{padding:5px}
.popover.memberpop:not([hidden]){display:flex;flex-direction:column;gap:3px;min-width:0}
.mopt{
  display:flex;align-items:center;gap:6px;height:30px;padding:0 8px;
  border:1px solid var(--line);border-radius:7px;background:var(--panel);
}
.mopt .bubico{width:19px;height:19px;flex:0 0 auto;transform:translateY(1px)}
.mopt span{font-size:11px;line-height:1;white-space:nowrap}
.tailrow{display:flex;align-items:center;gap:5px;width:100%}
.tsep{flex:0 0 auto;width:1px;height:22px;background:var(--line);margin:0 2px}
.tailrow .seg{flex:1;min-width:0;flex-wrap:nowrap;gap:5px;justify-content:flex-start}
.tailrow .seg button{flex:1;min-width:0;height:34px;padding:0 4px}
#autoSeg button,#msgMarkSeg button[data-v="quote"],
.cmenu .gbtn[data-g="qtb"],.cmenu .gbtn[data-g="qts"],.cmenu .gbtn[data-g="brk"]{font-family:var(--uiff,inherit)}
.tailflip{
  flex:0 0 auto;width:34px;height:34px;padding:0;
  border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);
  display:inline-flex;align-items:center;justify-content:center;
}
.tailflip svg{width:17px;height:17px}
.tailflip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.labelrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.labelrow > span{color:var(--muted);font-size:10px}
.minichk span{font-size:10px;color:var(--muted)}
.grid3b{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.grid3b .stepper{width:100%}
.grid3b .stepper input{flex:1;width:auto;min-width:0}
/* 켜기·끄기 토글 */
.tgl{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:34px}
.tgl > span{font-size:10px;color:var(--muted)}
.switch{
  position:relative;flex:0 0 auto;width:42px;height:24px;padding:0;
  border:0;border-radius:999px;background:#dcdee1;
  transition:background .16s;
}
.switch::after{
  content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;
  border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(16,24,40,.28);
  transition:transform .16s;
}
.switch[aria-pressed="true"]{background:var(--accent)}
.switch[aria-pressed="true"]::after{transform:translateX(18px)}
/* 대화 ─ 말풍선 디자인 프리셋 */
.msgrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.msgpreset{
  display:flex;flex-direction:column;align-items:stretch;gap:9px;
  padding:11px 10px 9px;border:1px solid var(--line);border-radius:12px;background:var(--panel);
}
.msgpreset[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px rgba(28,29,32,.10)}
.mpprev{
  display:flex;flex-direction:column;justify-content:space-evenly;
  width:100%;aspect-ratio:24/9;padding:0 8%;
  border-radius:9px;border:1px solid transparent;box-sizing:border-box;
}
.mpprev .mb{display:block;flex:0 0 auto;height:26%;box-sizing:border-box;border-radius:7px}
.mpprev .mb.l{width:66%;align-self:flex-start}
.mpprev .mb.r{width:54%;align-self:flex-end}
.mpname{font-size:9px;color:var(--muted);text-align:center}
.msgpreset[aria-pressed="true"] .mpname{color:var(--ink)}
[data-mp="kakao"] .mpprev{background:#b2c7da}
[data-mp="kakao"] .mb.l{background:#ffffff}
[data-mp="kakao"] .mb.r{background:#fee500}
[data-mp="imessage"] .mpprev{background:#ffffff;border-color:var(--line)}
[data-mp="imessage"] .mb.l{background:#e9e9eb}
[data-mp="imessage"] .mb.r{background:#007aff}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:30px}
.row label{color:var(--muted);flex:0 0 auto}
.field{display:flex;flex-direction:column;gap:7px}
.field > span{color:var(--muted);font-size:10px}
input[type=color]{
  width:26px;height:26px;padding:0;border:1px solid rgba(0,0,0,.12);
  border-radius:7px;background:none;cursor:pointer;
}
input[type=color]::-webkit-color-swatch-wrapper{padding:0}
input[type=color]::-webkit-color-swatch{border:none;border-radius:6px}
input[type=color]::-moz-color-swatch{border:none;border-radius:6px}
input[type=text],select{
  height:34px;border:1px solid var(--line);border-radius:9px;
  padding:0 11px;background:var(--panel);min-width:0;
}
textarea{
  border:1px solid var(--line);border-radius:9px;
  padding:9px 11px;background:var(--panel);min-width:0;
}
input[type=text]::placeholder{font-size:9.5px;color:#c4c8ce}
input[type=text]::-webkit-input-placeholder{font-size:9.5px;color:#c4c8ce}
.seg{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.seg button{height:34px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:0 11px}
.seg button[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.swatches{display:flex;gap:6px}
.swatches button{width:26px;height:26px;border-radius:7px;border:1px solid rgba(0,0,0,.12)}
.colorset{display:flex;gap:7px}
.colorset.col{flex-direction:column}
/* 색상 탭 ─ 미리보기형 */
.cprow{display:flex;align-items:center;gap:11px}
.cprow > span{flex:0 0 62px;color:var(--muted);font-size:10px}
.cprevs{flex:1;display:flex;gap:7px;min-width:0}
.cprev{
  flex:1;min-width:0;height:34px;padding:0 6px;
  display:flex;align-items:center;justify-content:center;gap:6px;
  border:1px solid var(--line);border-radius:9px;background:var(--panel);
  overflow:hidden;
}
.cprev:active{transform:translateY(1px)}
.cprev .dot{
  flex:0 0 auto;width:12px;height:12px;border-radius:4px;
  border:1px solid rgba(0,0,0,.14);
}
.cprev .s{font-family:var(--uiff,inherit);font-size:10px;line-height:1.1;white-space:nowrap;font-weight:600}
.cprev .s.hl{padding:2px 5px;border-radius:2px}
.cprev .s.em{border-left:4px solid currentColor;padding-left:6px}
.bgset{display:flex;gap:7px;flex:0 0 auto}
.bgsw{
  width:30px;height:30px;flex:0 0 auto;
  border:1px solid rgba(0,0,0,.18);border-radius:8px;background:#fff;
  background-clip:padding-box;
  position:relative;
}
.bgsw:active{transform:translateY(1px)}
.bgsw[aria-pressed="true"]{
  border-color:var(--accent);
  box-shadow:0 0 0 2px rgba(28,29,32,.10);
}
.bgsw.custom{
  background:conic-gradient(#f87171,#fbbf24,#a3e635,#34d399,#38bdf8,#818cf8,#e879f9,#f87171);
  background-clip:padding-box;
}
.bgsw.custom.picked{
  background:var(--pickbg,#fff);
  background-clip:padding-box;
}
.fbtn.bubbtn{display:inline-flex;align-items:center;justify-content:center;padding:0 8px}
.bubico{width:18px;height:18px;flex:0 0 auto;transform:translateY(1.5px)}
#imgBtn .bubico{transform:none}
.bubico .bd{fill:#fff;stroke:var(--ink);stroke-width:1;stroke-linejoin:round}
#imgBtn .bubico .bd{stroke:#9aa0a6}
#bubL .bd{fill:var(--uimlbg,#fff);stroke:var(--uimlst,#b9bbbf);stroke-width:1}
#bubR .bd{fill:var(--uimrbg,#fff);stroke:var(--uimrst,#b9bbbf);stroke-width:1}
.bubico .sun{fill:#efb64a}
.bubico .mtn{fill:#7fa88a}
.crow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:32px}
.crow > span{color:var(--muted);font-size:10px}
.cgroup2{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:32px}
.cgrid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 12px}
.cgrid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 12px}
.cgrid3 .cgroup2{flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:8px;min-height:0}
.cgrid3 .cgroup2 > span{font-size:10px;color:var(--muted)}
.cgrid3 .csqset{gap:8px}
.cgrid2 .cgroup2{flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:8px;min-height:0}
.cgrid2 .cgroup2 > span{font-size:10px;color:var(--muted)}
.cgrid2 .csqset{gap:8px}
.cgroup2 > span{color:var(--muted);font-size:10px}
.csqset{display:flex;gap:7px}
.csq{
  width:30px;height:30px;flex:0 0 auto;
  border:1px solid rgba(0,0,0,.14);border-radius:8px;background:#fff;
}
.csq:active{transform:translateY(1px)}
/* 헥사 입력 모달 */
.modal-back{
  position:fixed;inset:0;z-index:80;background:rgba(20,22,26,.35);
  display:flex;align-items:center;justify-content:center;padding:24px;
}
.modal-back[hidden]{display:none}
.modal{
  width:100%;max-width:280px;background:var(--panel);border-radius:16px;
  padding:18px;box-shadow:0 20px 50px -16px rgba(16,24,40,.5);
}

  font-variant-numeric:tabular-nums;
}
.imgbar button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
[data-ph]:empty::before{content:attr(data-ph);color:#b0b5be}

/* ── 토스트 ────────────────────────────── */
#toast{
  position:fixed;left:50%;bottom:22px;transform:translate(-50%,14px);
  background:#16181d;color:#fff;padding:10px 16px;border-radius:999px;
  font-size:10px;opacity:0;pointer-events:none;transition:.22s;z-index:90;
}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ── 캡처 중 ───────────────────────────── */
body.capturing .fitwrap{transform:none;zoom:1}
body.capturing .card{box-shadow:none;border-radius:0}

@media (min-width:560px){
  .msgrow{grid-template-columns:repeat(4,minmax(0,1fr))}

}
@media (min-width:700px) and (max-width:899px){

/* 넓은 화면: 왼쪽 미리보기 · 오른쪽 편집 */
.wideacts{display:none}
.stagefit,.stageside{display:none}
@media (min-width:900px){
  html,body{height:100%;overflow:hidden}
  body{padding-bottom:0!important}

  .topbar{display:none}
  .wide{height:100vh}
  .wideacts{
    display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;
    padding:10px 13px;height:52px;box-sizing:border-box;background:var(--panel);
    border-bottom:1px solid var(--line);
  }
  .wideacts .btn{height:32px;justify-content:center;text-align:center}

  .wideacts #splitBtn2{background:#bdbfc2;border-color:#bdbfc2;color:var(--ink)}
  .stage{position:relative}
  .stagefit,.stageside{
    display:inline-flex;align-items:center;
    position:absolute;top:10px;z-index:5;height:32px;
  }
  .stagefit{left:16px}
  .stageside{right:16px}
  /* 탭이 왼쪽일 때는 두 버튼 자리도 뒤바뀜 */
  body.tabsleft .wide{grid-template-columns:420px minmax(0,1fr)}
  body.tabsleft .editpane{order:-1;border-left:0;border-right:1px solid var(--line)}
  body.tabsleft .stagefit{left:auto;right:16px}
  body.tabsleft .stageside{right:auto;left:16px}
  .memc{height:22px}
  .msgpreset{gap:7px;padding:9px 8px 7px}
  .mpprev{aspect-ratio:24/10;padding:0 7%}
  .mpprev .mb{height:24%}
  .memlist{grid-template-columns:repeat(2,minmax(0,1fr))}   /* 패널이 좁으므로 2열 */
  .msgrow{grid-template-columns:repeat(3,minmax(0,1fr))}
  /* 좁은 패널이라 컨트롤을 살짝 낮게 */
  .seg button,.cell > .seg button,.stepper,.ratiobtn,
  input[type=text],select,.tailrow .seg button,.tailflip{height:31px}
  .btn.tall{height:33px}
  .stepper.compact,.wbtn{height:26px}
  .wide{display:grid;grid-template-columns:minmax(0,1fr) 420px;align-items:start}
  body.tabsleft .wide{grid-template-columns:420px minmax(0,1fr)}
  .stage{
    height:100%;overflow-y:auto;overflow-x:auto;
    display:flex;align-items:center;justify-content:center;
    padding:40px 24px;
  }
  .editpane{
    height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr);
    border-left:1px solid var(--line);background:var(--panel);
  }
  .tabbar{
    display:flex;flex-direction:row;height:auto;overflow:visible;
    border-bottom:1px solid var(--line);border-right:0;background:var(--panel);
  }
  .tab{flex:1 1 0;padding:0 3px;height:42px;font-size:11px}
  .panelwrap{min-height:0;height:100%;overflow-y:auto}
  /* 스크롤 영역에 잘리지 않도록 툴바 팝업은 아래로 열기 */
  .cmenu .cpop,.hrmenu .hrpop,.popover.row3{
    top:calc(100% + 6px);bottom:auto;
  }
  .panels{max-width:none;padding:0}
  .pbody{padding:16px 18px 22px}
  .fitwrap{margin:auto}
}
@media (min-width:1280px){

<script>
(function(){
  "use strict";
  const $ = s => document.querySelector(s);
  const card = $("#card"), inner = $("#inner"), stage = $("#stage"), fitwrap = $("#fitwrap");
  const editor = $("#editor"), titleIn = $("#titleIn"), subIn = $("#subIn");
  const srcTitle = $("#srcTitle"), srcAuthor = $("#srcAuthor");
  // 책 제목 · 지은이 — 둘 다 있을 때만 가운뎃점을 넣음
  function sourceText(){
    const a = srcTitle.value.trim(), b = srcAuthor.value.trim();
    if (a && b) return a + " \u00B7 " + b;
    return a || b;
  }
  const pvTitle = $("#pvTitle"), pvSub = $("#pvSub"), pvBody = $("#pvBody"), pvSource = $("#pvSource");
  let saveScale = 2;
  let saveSeq = {};   // 이름별 저장 횟수

  /* ── 토스트 ── */
  let toastTimer;
  function toast(msg){
    const t = $("#toast");
    t.textContent = msg; t.classList.add("on");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("on"), 1900);
  }

  const setVar = (k, v) => card.style.setProperty(k, v);

  /* ── 미리보기 반영 ── */
  function sync(){
    const html = editor.innerHTML.trim();
    const bodyEmpty = editor.textContent.trim() === "" && !/<img/i.test(html);
    pvBody.innerHTML = bodyEmpty ? "" : html;
    pvBody.querySelectorAll("[contenteditable]").forEach(el => el.removeAttribute("contenteditable"));
    pvBody.querySelectorAll(".msgctl").forEach(el => el.remove());
    pvBody.classList.toggle("empty", bodyEmpty);

    pvTitle.textContent = titleIn.value;
    pvTitle.classList.toggle("empty", titleIn.value.trim() === "");

    pvSub.textContent = subIn.value;
    pvSub.classList.toggle("empty", subIn.value.trim() === "");

    const srcText = sourceText();
    pvSource.textContent = srcText;
    pvSource.classList.toggle("empty", srcText === "");

    fit();
  }
  editor.addEventListener("input", sync);
  titleIn.addEventListener("input", sync);
  subIn.addEventListener("input", sync);
  srcTitle.addEventListener("input", sync);
  srcAuthor.addEventListener("input", sync);

  /* ── 넘침 안내 ── */
  let fitQueued = false;
  /* ── 예시 카드 확대·축소 (50~200%) ── */
  let zoomPct = 100;
  function applyZoom(){
    fitwrap.style.zoom = zoomPct / 100;
    lastScrollW = 0;          // 폭이 달라졌으니 다시 가운데로
    requestAnimationFrame(centerStage);
  }
  function setZoom(v){
    zoomPct = Math.min(200, Math.max(25, Math.round(v)));
    applyZoom();
    ["#fitBtn","#fitBtn2"].forEach(id => { const b=$(id); if(b) b.setAttribute("aria-pressed", String(zoomPct !== 100)); });
  }
  // 탭 위치 좌/우 전환 (기억됨)
  const SIDE_KEY = "excerpt.tabside";
  function setTabSide(left){
    document.body.classList.toggle("tabsleft", !!left);
    try { localStorage.setItem(SIDE_KEY, left ? "left" : "right"); } catch (e) {}
  }
  $("#sideBtn").addEventListener("click", () => {
    setTabSide(!document.body.classList.contains("tabsleft"));
  });
  try { if (localStorage.getItem(SIDE_KEY) === "left") setTabSide(true); } catch (e) {}

  const doFit = () => {
    if (zoomPct !== 100) return setZoom(100);          // 이미 맞춰둔 상태면 원래대로
    const avail = stage.clientWidth - 28;              // 좌우 여백 제외
    const need = card.offsetWidth;
    if (!need || avail >= need) return toast("이미 화면에 다 들어와요");
    setZoom(Math.floor(avail / need * 100));
  };
  $("#fitBtn").addEventListener("click", doFit);
  $("#fitBtn2").addEventListener("click", doFit);

  let lastScrollW = 0;
  function centerStage(){
    if (window.matchMedia("(min-width:900px)").matches) return;   // 2단에서는 flex가 중앙 정렬
    const sw = stage.scrollWidth, cw = stage.clientWidth;
    if (sw === lastScrollW) return;      // 폭이 바뀔 때만 (사용자 스크롤 방해 안 함)
    lastScrollW = sw;
    if (sw > cw) stage.scrollLeft = (sw - cw) / 2;
  }

  function fit(){
    if (fitQueued) return;
    fitQueued = true;
    requestAnimationFrame(() => {
      fitQueued = false;
      const over = card.classList.contains("fixed") && inner.scrollHeight > card.clientHeight + 1;
      $("#overflowHint").hidden = !over;
      centerStage();
    });
  }
  window.addEventListener("resize", () => { lastScrollW = 0; centerStage(); });
  window.addEventListener("resize", fit);
  if (window.ResizeObserver) new ResizeObserver(fit).observe(card);

  /* ── 붙여넣기: 순수 텍스트 ── */
  editor.addEventListener("paste", e => {
    e.preventDefault();
    const text = (e.clipboardData || window.clipboardData).getData("text/plain");
    document.execCommand("insertText", false, text);
  });

  /* ── 선택 영역 유지 ── */
  let lastRange = null;
  document.addEventListener("selectionchange", () => {
    const sel = window.getSelection();
    if (!sel.rangeCount) return;
    const r = sel.getRangeAt(0);
    if (editor.contains(r.commonAncestorContainer)) lastRange = r.cloneRange();
  });
  function restore(){
    if (!lastRange) return false;
    editor.focus();
    const sel = window.getSelection();
    sel.removeAllRanges(); sel.addRange(lastRange);
    return !sel.isCollapsed;
  }
  document.querySelectorAll(".fmtbar button").forEach(b => {
    b.addEventListener("pointerdown", e => e.preventDefault());
  });

  /* ── B / I / U ── */
  document.querySelectorAll("[data-cmd]").forEach(b => {
    b.addEventListener("click", () => {
      if (!restore()) return toast("먼저 글자를 드래그해서 선택해 주세요");
      document.execCommand(b.dataset.cmd, false, null);
      sync();
    });
  });

  /* ── 선택 영역 감싸기 ── */
  // 첫/마지막 텍스트 노드 찾기
  function edgeTextNode(el, last){
    const w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null);
    let n, found = null;
    while ((n = w.nextNode())) { if (n.data.length) { found = n; if (!last) break; } }
    return found;
  }
  // 이미 따옴표·괄호가 있으면 모양만 맞추고, 없을 때만 새로 붙임
  function applyMarks(span, opts){
    const [mo, mc] = opts.marks;
    const openVars  = opts.openVars  || [mo];
    const closeVars = opts.closeVars || [mc];
    const t = span.textContent;
    const hasPair = t.length >= 2 &&
                    openVars.indexOf(t[0]) >= 0 &&
                    closeVars.indexOf(t[t.length - 1]) >= 0;
    if (hasPair) {
      if (t[0] !== mo) {
        const f = edgeTextNode(span, false);
        if (f) f.data = mo + f.data.slice(1);
      }
      if (t[t.length - 1] !== mc) {
        const l = edgeTextNode(span, true);
        if (l) l.data = l.data.slice(0, -1) + mc;
      }
      return;
    }
    span.insertBefore(document.createTextNode(mo), span.firstChild);
    span.appendChild(document.createTextNode(mc));
  }

  // 바로 옆에 같은 종류·같은 스타일이 붙어 있으면 하나로 합침
  function mergeSameNeighbors(span){
    const same = el => el && el.nodeType === 1 && el.tagName === "SPAN" &&
                       el.dataset.kind === span.dataset.kind &&
                       el.getAttribute("style") === span.getAttribute("style");
    const prev = span.previousSibling;      // 바로 붙어 있을 때만 합침
    if (same(prev)) {
      while (span.firstChild) prev.appendChild(span.firstChild);
      span.parentNode.removeChild(span);
      span = prev;
    }
    const next = span.nextSibling;
    if (same(next)) {
      while (next.firstChild) span.appendChild(next.firstChild);
      next.parentNode.removeChild(next);
    }
    span.normalize();
    return span;
  }

  function wrapSelection(styleText, opts){
    opts = opts || {};
    if (!restore()) { toast("먼저 글자를 드래그해서 선택해 주세요"); return; }
    const sel = window.getSelection();
    const range = sel.getRangeAt(0);
    const span = document.createElement("span");
    span.setAttribute("style", styleText);
    span.dataset.fmt = "1";
    if (opts.kind) span.dataset.kind = opts.kind;
    try {
      span.appendChild(range.extractContents());
      range.insertNode(span);
    } catch (err) {
      toast("이 범위는 한 번에 감쌀 수 없어요. 조금 더 좁게 선택해 보세요");
      return;
    }
    // 같은 종류(형광펜↔형광펜 등) 겹침 정리
    if (opts.kind) {
      const sameKind = 'span[data-kind="' + opts.kind + '"]';
      // 안쪽에 완전히 들어온 같은 종류는 새 색이 이기도록 제거
      span.querySelectorAll(sameKind).forEach(inner => {
        const p = inner.parentNode;
        while (inner.firstChild) p.insertBefore(inner.firstChild, inner);
        p.removeChild(inner);
      });
      // 기존 색 안에서 일부만 다시 칠한 경우: 겹친 부분만 새 색으로,
      // 앞뒤 남은 부분은 원래 색을 유지하도록 바깥 span을 쪼갬
      const outer = span.parentElement;
      if (outer && outer !== editor && outer.matches && outer.matches(sameKind)) {
        const parent = outer.parentNode;
        const before = outer.cloneNode(false), after = outer.cloneNode(false);
        let seen = false;
        [...outer.childNodes].forEach(n => {
          if (n === span) { seen = true; return; }
          (seen ? after : before).appendChild(n);
        });
        if (before.textContent.length) parent.insertBefore(before, outer);
        parent.insertBefore(span, outer);
        if (after.textContent.length) parent.insertBefore(after, outer);
        parent.removeChild(outer);
      }
    }
    if (opts.marks) applyMarks(span, opts);
    span.normalize();
    const merged = mergeSameNeighbors(span);
    const r = document.createRange();
    r.selectNodeContents(merged);
    sel.removeAllRanges(); sel.addRange(r);
    lastRange = r.cloneRange();
    sync();
  }

  const FMT_SEL = 'span[data-fmt], b, strong, i, em, s, strike, u, font';

  function unwrapEl(el){
    const p = el.parentNode;
    while (el.firstChild) p.insertBefore(el.firstChild, el);
    p.removeChild(el);
  }

  // 드래그 없이, 커서가 놓인 자리의 서식을 지움
  function clearFormatAtCursor(){
    const sel = window.getSelection();
    if (!sel.rangeCount) return false;
    const node = sel.anchorNode;
    if (!node || !editor.contains(node)) return false;
    const el = node.nodeType === 1 ? node : node.parentElement;
    if (!el) return false;

    // 1) 커서를 감싼 서식 조각이 있으면 그것만 풂
    const inline = el.closest(FMT_SEL);
    if (inline && editor.contains(inline)) { unwrapEl(inline); editor.normalize(); return true; }

    // 2) 강조선(인용구) 안이면 강조선 해제
    const bq = el.closest("blockquote[data-emline]");
    if (bq && editor.contains(bq)) { unwrapEl(bq); return true; }

  }

  // 선택 영역에 걸친 우리 서식 span을 풀어냄 (removeFormat이 못 지우는 형광펜 등)
  function unwrapStyledSpans(){
    const sel = window.getSelection();
    if (!sel.rangeCount) return;
    const range = sel.getRangeAt(0);
    const spans = [...editor.querySelectorAll('span[data-fmt]')].filter(s => range.intersectsNode(s));
    spans.forEach(s => {
      const parent = s.parentNode;
      while (s.firstChild) parent.insertBefore(s.firstChild, s);

    });

  // 선택이 걸친 문단(줄) 단위 블록들을 찾음 (blockquote 안에 있어도 포함)
  // 문단으로 감싸지지 않은 글을 문단으로 만들어 줌 (줄바꿈 기준으로 나눔)
  function ensureBlocks(){
    // 감쌀 것이 없으면 손대지 않음 (커서가 튀지 않도록)
    const needs = [...editor.childNodes].some(n =>
      (n.nodeType === 3 && n.data.trim() !== "") ||
      (n.nodeType === 1 && !/^(DIV|P|HR|BLOCKQUOTE|BR)$/.test(n.tagName)));
    if (!needs) return;
    // 커서 위치 기억
    const sel = window.getSelection();
    let mark = null;
    if (sel.rangeCount && editor.contains(sel.getRangeAt(0).startContainer)) {
      mark = document.createElement("span");
      mark.dataset.caret = "1";
      const r = sel.getRangeAt(0).cloneRange();
      r.collapse(true);
      r.insertNode(mark);
    }
    const nodes = [...editor.childNodes];
    let run = [];
    const flush = ref => {
      if (!run.length) return;
      const hasText = run.some(n => n.nodeType === 3 ? n.data.trim() : n.textContent.trim());
      if (hasText) {
        const wrap = document.createElement("div");
        editor.insertBefore(wrap, ref);
        run.forEach(n => wrap.appendChild(n));
      } else {
        run.forEach(n => n.parentNode && n.parentNode.removeChild(n));
      }
      run = [];
    };
    nodes.forEach(n => {
      const isBlock = n.nodeType === 1 && /^(DIV|P|HR|BLOCKQUOTE)$/.test(n.tagName);
      const isBr = n.nodeType === 1 && n.tagName === "BR";
      if (isBlock) { flush(n); return; }        // 기존 문단은 건드리지 않음
      if (isBr) { flush(n); n.parentNode.removeChild(n); return; }   // 줄바꿈에서 문단 분리
      run.push(n);
    });
    flush(null);
    // 커서 복원
    if (mark && mark.parentNode) {
      const r = document.createRange();
      r.setStartAfter(mark); r.collapse(true);
      const sel2 = window.getSelection();
      sel2.removeAllRanges(); sel2.addRange(r);
      mark.parentNode.removeChild(mark);
      lastRange = r.cloneRange();
    }
    editor.normalize();
  }
  function selectedBlocks(){
    const sel = window.getSelection();
    if (!sel.rangeCount || !editor.contains(sel.getRangeAt(0).commonAncestorContainer)) return [];
    const range = sel.getRangeAt(0);
    const paras = [];
    editor.querySelectorAll("div,p").forEach(el => {
      // 문단 자체(그 안에 또 다른 div/p가 없는 최말단 블록)만
      if (el.querySelector("div,p")) return;
      if (range.intersectsNode(el)) paras.push(el);
    });
    return paras;
  }

  // 강조선: 선택한 문단들을 하나의 인용구로 묶어 왼쪽에 세로 막대 하나. 같은 색이면 해제
  function applyEmphasisLine(color){
    // 드래그하지 않고 커서만 둔 경우에도 그 문단에 적용
    restore();
    const sel0 = window.getSelection();
    if (!sel0.rangeCount || !editor.contains(sel0.getRangeAt(0).commonAncestorContainer)) {
      toast("강조할 문단에 커서를 두거나 글자를 선택해 주세요");
      return;
    }
    const blocks = selectedBlocks();
    if (!blocks.length) { toast("본문에서 문단을 선택해 주세요"); return; }

    // 선택 범위가 이미 하나의 강조선 인용구 안에 완전히 들어있으면 해제(토글)
    const wraps = blocks.map(b => b.closest ? b.closest("blockquote[data-emline]") : null);
    const firstWrap = wraps[0];
    if (firstWrap && wraps.every(w => w === firstWrap) &&
        firstWrap.dataset.emline === color &&
        blocks.length === [...firstWrap.children].filter(c => c.nodeType === 1).length) {
      while (firstWrap.firstChild) firstWrap.parentNode.insertBefore(firstWrap.firstChild, firstWrap);
      firstWrap.parentNode.removeChild(firstWrap);
      sync();
      return;
    }

    // 기존에 걸쳐 있던 강조선 인용구는 먼저 풀어줌 (중첩 방지)
    blocks.forEach(b => {
      const w = b.closest ? b.closest("blockquote[data-emline]") : null;
      if (w) { while (w.firstChild) w.parentNode.insertBefore(w.firstChild, w); w.parentNode.removeChild(w); }
    });

    // 처음 잡은 문단 참조를 그대로 하나의 blockquote로 묶기
    const fresh = blocks.filter(b => editor.contains(b));
    if (!fresh.length) { sync(); return; }
    const bq = document.createElement("blockquote");
    bq.dataset.emline = color;
    bq.setAttribute("style", "border-left:4px solid " + color + ";padding-left:.9em;margin:0 0 var(--pg);");
    fresh[0].parentNode.insertBefore(bq, fresh[0]);
    fresh.forEach(b => bq.appendChild(b));
    sync();
  }

  function outlineFor(hex){

  function applyPhoto(el, m){
    if (!el) return;

    el.style.background = "transparent";
    const img = document.createElement("img");
    img.src = m.photo;
    el.appendChild(img);
    const place = () => {
      const bw = el.clientWidth, bh = el.clientHeight;
      if (!bw || !bh) { requestAnimationFrame(place); return; }
      const pw = m.pw || 1, ph = m.ph || 1, z = m.pz || 1;
      // 상자를 채우는 배율 × 확대값으로 실제 크기를 지정 (transform 확대 없이 → 선명)

    };

  }

  const photoModal = $("#photoModal"), cropBox = $("#cropBox");

    const mx = Math.max(0, (W - 1) / 2) * 100;

  /* ── 대화 ─ 멤버 ── */

  function startBlockDrag(blk, ev){
    ev.preventDefault();
    ev.stopPropagation();
    const handle = ev.currentTarget;
    handle.setPointerCapture(ev.pointerId);

    const move = e => {
      const y = e.clientY;
      const sibs = [...editor.children].filter(n => n !== blk);
      let target = null;
      for (const n of sibs){
        const r = n.getBoundingClientRect();
        if (y < r.top + r.height / 2) { target = n; break; }
      }
      if (target) { if (blk.nextElementSibling !== target) editor.insertBefore(blk, target); }
      else if (editor.lastElementChild !== blk) editor.appendChild(blk);
    };
    const up = () => {
      handle.removeEventListener("pointermove", move);
      handle.removeEventListener("pointerup", up);
      handle.removeEventListener("pointercancel", up);
      blk.classList.remove("dragging");
      if (typeof markContinuations === "function") markContinuations();
      sync();
      if (blk.classList.contains("imgblk") && typeof placeImgBar === "function") placeImgBar(blk);

    handle.addEventListener("pointermove", move);
    handle.addEventListener("pointerup", up);

  // 말풍선의 화자를 다른 멤버로 교체

  let tailFlip = false;
  function effTail(side){
    let t = tailShape;

      t = t === "top" ? "bottom" : t === "bottom" ? "top"
        : t === "sharp-top" ? "sharp-bottom" : t === "sharp-bottom" ? "sharp-top" : t;
    }

  }
  function bubbleRadius(side){
    const cur = getComputedStyle(card).getPropertyValue("--mrad2").trim();
    const r = cur || MSG_PRESETS[msgPreset].radius, sm = "4px";
    let tl = r, tr = r, br = r, bl = r;
    const left = side !== "right";
    const t = effTail(side);
    if (t === "sharp-top")    { if (left) tl = sm; else tr = sm; }
    if (t === "sharp-bottom") { if (left) bl = sm; else br = sm; }
    return tl + " " + tr + " " + br + " " + bl;
  }
  // 멤버·측면·대사로 말풍선 블록 하나를 만듦
  function buildBubble(m, side, text){
    const blk = document.createElement("div");

    blk.dataset.tail = (effTail(side) === "top" || effTail(side) === "bottom") ? effTail(side) : "none";

  function insertBubble(side){
    const m = side === "right"
      ? (members.find(x => x.side === "right") || defaultMember("right","본인"))
      : (currentLeft() || defaultMember("left","상대방1"));
    const blk = buildBubble(m, side, "대사");

    editor.focus();
    restore();
    const sel = window.getSelection();
    const inEditor = sel.rangeCount && editor.contains(sel.getRangeAt(0).commonAncestorContainer);
    if (!inEditor) editor.appendChild(blk);
    else {
      let node = sel.getRangeAt(0).commonAncestorContainer;
      if (node.nodeType !== 1) node = node.parentElement;
      let top = node;
      while (top && top.parentNode !== editor) top = top.parentNode;
      if (top && top.parentNode === editor) editor.insertBefore(blk, top.nextSibling);
      else editor.appendChild(blk);
    }
    if (!blk.nextSibling) {
      const line = document.createElement("div");
      line.appendChild(document.createElement("br"));

    }
    markContinuations();
    if (typeof syncBubbleMembers === "function") syncBubbleMembers(); else sync();
  }
  // 빈 줄에서 백스페이스를 누르면 그 줄을 지움 (말풍선 사이 빈 줄 정리)

    if (e.key !== "Backspace" && e.key !== "Delete") return;
    const sel = window.getSelection();
    if (!sel.rangeCount || !sel.isCollapsed) return;
    let node = sel.getRangeAt(0).startContainer;
    if (node.nodeType !== 1) node = node.parentElement;
    const line = node && node.closest ? node.closest("#editor > div") : null;
    if (!line || line.classList.contains("msgblk") || line.classList.contains("imgblk")) return;
    if (line.textContent.trim() !== "") return;
    e.preventDefault();
    const prev = line.previousElementSibling, next = line.nextElementSibling;

      r.selectNodeContents(target); r.collapse(false);
      sel.removeAllRanges(); sel.addRange(r);
    }
    sync();
  });

  // 같은 사람이 연달아 말하면 이름·사진을 숨김 (자리는 유지)

  }

  // 왼쪽 말풍선: 상대가 2명 이상이면 길게 눌러 고르기

  (function(){

    const fromTop = (e.clientY - rect.top) < EDGE;
    const fromBottom = (rect.bottom - e.clientY) < EDGE;
    const mode = (fromTop || fromBottom) ? "resize" : "pan";

    const startY = e.clientY, startX = e.clientX;

  /* ── 따옴표·괄호 자동 감지 (툴바에서 고른 색을 따라감) ── */
  // 툴바 그룹에서 현재 선택된 색 변수 (예: --qtb1 / --qtb2)
  const curVar = g => GROUPS[g].vars[gCur[g]];
  const BIG_RULES = () => [
    { open:"\u201C", close:"\u201D", cvar:curVar("qtb"), same:false },
    { open:'"',      close:'"',      cvar:curVar("qtb"), same:true, canon:["\u201C","\u201D"] }
  ];
  const SMALL_RULES = () => [
    { open:"\u2018", close:"\u2019", cvar:curVar("qts"), same:false },
    { open:"'",      close:"'",      cvar:curVar("qts"), same:true, canon:["\u2018","\u2019"] }
  ];
  const BRACKET_RULES = () => [
    { open:"(", close:")", cvar:curVar("brk"), same:false },
    { open:"[", close:"]", cvar:curVar("brk"), same:false },
    { open:"{", close:"}", cvar:curVar("brk"), same:false }
  ];
  // 말풍선과 함께 켜면 대괄호는 말풍선 몫이라 괄호에서 뺌
  const BRACKET_RULES_NOSQUARE = () => [
    { open:"(", close:")", cvar:curVar("brk"), same:false },
    { open:"{", close:"}", cvar:curVar("brk"), same:false }
  ];
  function findPairs(text, open, close, same){
    const res = [];
    if (same){
      let idx = -1;
      for (let i = 0; i < text.length; i++){
        if (text[i] === open){ if (idx < 0) idx = i; else { res.push([idx, i + 1]); idx = -1; } }
      }
    } else {
      const stack = [];
      for (let i = 0; i < text.length; i++){
        if (text[i] === open) stack.push(i);
        else if (text[i] === close && stack.length){ const s = stack.pop(); if (!stack.length) res.push([s, i + 1]); }
      }
    }
    return res;
  }
  function applyRules(rules){
    let count = 0;
    rules.forEach(rule => {
      const color = colorOf(rule.cvar);
      const walker = document.createTreeWalker(editor, NodeFilter.SHOW_TEXT, null);
      const targets = [];
      let node;
      while ((node = walker.nextNode())){
        if (node.parentElement && node.parentElement.closest('span[data-kind="tc"], .msgblk')) continue;
        targets.push(node);
      }
      targets.forEach(textNode => {
        const ranges = findPairs(textNode.textContent, rule.open, rule.close, rule.same);
        if (!ranges.length) return;
        let cur = textNode;
        for (let i = ranges.length - 1; i >= 0; i--){
          const [s, e] = ranges[i];
          cur.splitText(e);
          const mid = cur.splitText(s);
          const span = document.createElement("span");
          span.setAttribute("style", "color:" + color + ";");
          span.dataset.fmt = "1"; span.dataset.kind = "tc";
          let t = mid.textContent;
          if (rule.canon && t.length >= 2) t = rule.canon[0] + t.slice(1, -1) + rule.canon[1];
          span.textContent = t;
          mid.parentNode.replaceChild(span, mid);
          count++;

      });
    });

  }
  const autoOn = { big:false, small:false, bracket:false };

  paintAuto();
  // 대화 탭에서 고른 기호를 찾아 실제 말풍선으로 바꿈 (문장 중간도 인식)
  function detectMessages(){
    if (!msgMarks.length) return;
    const wrapPairs = [];
    if (msgMarks.indexOf("quote") >= 0) wrapPairs.push(["`","`"]);
    if (msgMarks.indexOf("bracket") >= 0) wrapPairs.push(["[","]"]);
    const seps = [];
    if (msgMarks.indexOf("colon") >= 0) seps.push(":");
    if (msgMarks.indexOf("pipe") >= 0)  seps.push("|");

    let changed = false;
    [...editor.children].forEach(el => {
      if (el.nodeType !== 1) return;
      if (el.classList.contains("msgblk") || el.classList.contains("imgblk") || el.tagName === "HR") return;
      const raw = el.textContent.replace(/\u00A0/g, " ").trim();
      if (!raw) return;

      // 이름 : 대사 / 이름 | 대사 → 그 이름의 멤버
      for (const sp of seps) {
        const i = raw.indexOf(sp);
        if (i <= 0) continue;
        const namePart = raw.slice(0, i).trim();
        const rest = raw.slice(i + 1).trim();
        if (!rest) continue;
        const m = members.find(x => (x.name || "").trim() === namePart);
        if (!m) continue;
        el.replaceWith(buildBubble(m, m.side, markDrop ? rest : raw));
        changed = true;
        return;
      }
      if (!wrapPairs.length) return;

      // 감싼 기호를 문장 어디에서든 찾아 잘라냄
      const parts = [];
      let i = 0;
      while (i < raw.length) {
        let best = -1, pair = null;
        wrapPairs.forEach(pr => {
          const at = raw.indexOf(pr[0], i);
          if (at >= 0 && (best < 0 || at < best)) { best = at; pair = pr; }
        });
        if (best < 0) { parts.push({ t:"text", v:raw.slice(i) }); break; }
        const close = raw.indexOf(pair[1], best + 1);
        if (close < 0) { parts.push({ t:"text", v:raw.slice(i) }); break; }
        if (best > i) parts.push({ t:"text", v:raw.slice(i, best) });
        const co = pair[2] || pair[0], cc = pair[3] || pair[1];
        parts.push({ t:"msg", v:raw.slice(best + 1, close), full:co + raw.slice(best + 1, close) + cc });
        i = close + 1;
      }
      if (!parts.some(x => x.t === "msg")) return;

      const m = currentLeft() || defaultMember("left", "상대방1");
      const frag = document.createDocumentFragment();
      parts.forEach(seg => {
        if (seg.t === "text") {
          const t = seg.v.trim();
          if (!t) return;
          const d = document.createElement("div");
          d.textContent = t;
          frag.appendChild(d);
        } else {
          const inner = seg.v.trim();
          if (!inner) return;
          frag.appendChild(buildBubble(m, "left", markDrop ? inner : seg.full));
        }
      });
      el.replaceWith(frag);
      changed = true;
    });
    if (changed) markContinuations();
  }

  function runAutoDetect(){
    const bubOn = msgMarks.length > 0;              // 대화 탭에서 고른 기호가 있으면 메시지 인식
    if (bubOn) detectMessages();                    // 메시지가 먼저 가져감
    const claims = k => bubOn && msgMarks.indexOf(k) >= 0;
    if (autoOn.big) applyRules(BIG_RULES());
    if (autoOn.small) applyRules(SMALL_RULES());
    if (autoOn.bracket) {
      applyRules(claims("bracket") ? BRACKET_RULES_NOSQUARE() : BRACKET_RULES());
    }
    sync();
  }

  /* ── 헥사 입력 + 색상판 모달 ── */
  const hexModal = $("#hexModal"), hexInput = $("#hexInput"), hexPrev = $("#hexPrev"),
        hexTitle = $("#hexTitle"), hexPicker = $("#hexPicker"),
        svArea = $("#svArea"), svThumb = $("#svThumb"), hueRange = $("#hueRange");
  let hexTargetVar = null, hexOnPick = null;
  let hsv = { h:0, s:0, v:0 };
  const isHex = s => /^[0-9a-fA-F]{6}$/.test(s);

  function hexToRgb(h){ h=h.replace("#",""); return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; }
  function rgbToHex(r,g,b){ const t=n=>("0"+Math.round(n).toString(16)).slice(-2); return "#"+t(r)+t(g)+t(b); }
  function rgbToHsv(r,g,b){
    r/=255; g/=255; b/=255;
    const mx=Math.max(r,g,b), mn=Math.min(r,g,b), d=mx-mn;
    let h=0;
    if(d){ if(mx===r)h=((g-b)/d)%6; else if(mx===g)h=(b-r)/d+2; else h=(r-g)/d+4; h*=60; if(h<0)h+=360; }
    return { h, s: mx? d/mx : 0, v: mx };
  }
  function hsvToRgb(h,s,v){
    const c=v*s, x=c*(1-Math.abs((h/60)%2-1)), m=v-c;
    let r=0,g=0,b=0;
    if(h<60){r=c;g=x;} else if(h<120){r=x;g=c;} else if(h<180){g=c;b=x;}
    else if(h<240){g=x;b=c;} else if(h<300){r=x;b=c;} else {r=c;b=x;}
    return [(r+m)*255,(g+m)*255,(b+m)*255];
  }
  function hueHex(h){ const [r,g,b]=hsvToRgb(h,1,1); return rgbToHex(r,g,b); }

  function renderPicker(){
    svArea.style.setProperty("--sv-hue", hueHex(hsv.h));
    hueRange.value = Math.round(hsv.h);
    const rect = svArea.getBoundingClientRect();
    svThumb.style.left = (hsv.s * svArea.clientWidth) + "px";
    svThumb.style.top  = ((1 - hsv.v) * svArea.clientHeight) + "px";
    const [r,g,b] = hsvToRgb(hsv.h, hsv.s, hsv.v);
    svThumb.style.background = rgbToHex(r,g,b);
  }
  function setFromHex(hex){
    const [r,g,b] = hexToRgb(hex);
    hsv = rgbToHsv(r,g,b);
    hexPrev.style.background = hex;
  }
  function pushFromHsv(){
    const [r,g,b] = hsvToRgb(hsv.h, hsv.s, hsv.v);
    const hex = rgbToHex(r,g,b);
    hexInput.value = hex.replace("#","").toUpperCase();
    hexPrev.style.background = hex;

    input.min = o.min; input.max = o.max; input.step = o.step;
    const def = parseFloat(input.value);

  // 여러 줄에 걸친 형광펜을 줄 단위 조각으로 나눔 (캡처 전용, 되돌릴 수 있게 원본 보관)
  function splitHighlightsForCapture(){
    let changed = false;
    pvBody.querySelectorAll('span[data-kind="hl"]').forEach(sp => {
      if (sp.getClientRects().length < 2) return;      // 한 줄이면 그대로
      const tn = sp.firstChild;
      if (!tn || tn.nodeType !== 3) return;
      const text = tn.data, style = sp.getAttribute("style") || "";
      const range = document.createRange();
      const cuts = [];
      let prevTop = null;
      for (let i = 1; i <= text.length; i++) {
        range.setStart(tn, i - 1); range.setEnd(tn, i);
        const top = range.getBoundingClientRect().top;
        if (prevTop !== null && Math.abs(top - prevTop) > 1) cuts.push(i - 1);
        prevTop = top;
      }
      if (!cuts.length) return;
      changed = true;
      const frag = document.createDocumentFragment();
      let start = 0;
      cuts.concat([text.length]).forEach(end => {
        const piece = document.createElement("span");
        piece.setAttribute("style", style);
        piece.dataset.kind = "hl";
        piece.textContent = text.slice(start, end);
        frag.appendChild(piece);
        start = end;
      });
      sp.parentNode.replaceChild(frag, sp);
    });
    return changed;
  }

  async function renderCanvas(){
    document.activeElement && document.activeElement.blur();
    if (document.fonts && document.fonts.ready) { try { await document.fonts.ready; } catch(e){} }
    document.body.classList.add("capturing");
    const zoomKeep = fitwrap.style.zoom;
    fitwrap.style.zoom = "1";
    // 배율만큼 카드를 실제로 키워서 그리면 사진·글자 모두 원본 해상도로 그려짐
    const sc = saveScale || 1;
    const keep = [];
    if (sc > 1) {
      const scaleVar = (el, name, mul) => {
        const v = getComputedStyle(el).getPropertyValue(name).trim();
        if (!v) return;
        keep.push([el, name, el.style.getPropertyValue(name)]);
        el.style.setProperty(name, (parseFloat(v) * mul) + (v.endsWith("%") ? "%" : "px"));
      };
      ["--w","--fs","--tfs","--sfs","--pg","--px","--py","--gapt","--gaps","--srcgap","--mpy","--mpx","--mrad2"]
        .forEach(n => scaleVar(card, n, sc));

    if (sc > 1) {

      });
      await new Promise(r => requestAnimationFrame(r));
    }
    const hlSaved = splitHighlightsForCapture();
    try {
      return await html2canvas(card, {
        onclone: prepareCloneTails,
        backgroundColor: null,
        scale: 1,
        useCORS: true,
        width: card.offsetWidth,
        height: card.offsetHeight,
        windowWidth: Math.max(window.innerWidth, card.offsetWidth + 80)

      if (hlSaved) sync();          // 쪼갠 형광펜을 원본(편집기)에서 다시 그려 복구
      keep.forEach(([el, n, v]) => { if (v) el.style.setProperty(n, v); else el.style.removeProperty(n); });
      fitwrap.style.zoom = zoomKeep;
      document.body.classList.remove("capturing");
      fit();
    }
  }

  function splitBodyParts(){
    const holder = document.createElement("div");
    holder.innerHTML = pvBody.innerHTML;
    // 문단 안에 있는 구분선을 바깥으로 끌어올림
    let guard = 0;
    while (holder.querySelector(":scope > * hr") && guard++ < 50) {
      const hr = holder.querySelector(":scope > * hr");
      let top = hr;
      while (top.parentNode !== holder) top = top.parentNode;
      const before = top.cloneNode(false), after = top.cloneNode(false);
      let seen = false;
      [...top.childNodes].forEach(n => {
        if (n === hr || n.contains && n.contains(hr)) { seen = true; return; }
        (seen ? after : before).appendChild(n);
      });
      if (before.textContent.trim() || before.querySelector("img,.imgblk,.msgblk")) holder.insertBefore(before, top);
      holder.insertBefore(hr, top);
      if (after.textContent.trim() || after.querySelector("img,.imgblk,.msgblk")) holder.insertBefore(after, top);
      top.remove();
    }
    const parts = [];
    let cur = document.createElement("div");
    [...holder.childNodes].forEach(n => {
      if (n.nodeType === 1 && n.tagName === "HR") {
        parts.push(cur.innerHTML);
        cur = document.createElement("div");
      } else {
        cur.appendChild(n.cloneNode(true));
      }
    });
    parts.push(cur.innerHTML);
    // 빈 장은 버리고, 사진·말풍선만 있는 장은 남김
    const out = [];
    parts.forEach(html => {
      const d = document.createElement("div");
      d.innerHTML = html;
      if (d.textContent.trim() || d.querySelector("img,.imgblk,.msgblk")) out.push(html);
    });
    return out;
  }

      fs: (document.querySelector('.stepper[data-num=fs] input') || {}).value,
      lh: (document.querySelector('.stepper[data-num=lh] input') || {}).value,
      ls: (document.querySelector('.stepper[data-num=ls] input') || {}).value,
      pg: (document.querySelector('.stepper[data-num=pg] input') || {}).value,
      align: (document.querySelector('#alignSeg button[aria-pressed=true]') || {dataset:{}}).dataset.v,
      wrap: (document.querySelector('#wbSeg button[aria-pressed=true]') || {dataset:{}}).dataset.v,
      bfw: (document.querySelector('#bwSeg button[aria-pressed=true]') || {dataset:{}}).dataset.v,
      auto: { big:autoOn.big, small:autoOn.small, bracket:autoOn.bracket },
      hs: (document.querySelector('.stepper[data-num=hs] input') || {}).value,
      gapt: (document.querySelector('.stepper[data-num=gapt] input') || {}).value,
      gaps: (document.querySelector('.stepper[data-num=gaps] input') || {}).value,
      srcgap: (document.querySelector('.stepper[data-num=srcgap] input') || {}).value,
      ratio: (document.querySelector('#ratioSeg button[aria-pressed=true]') || {dataset:{}}).dataset.v,
      w: (document.querySelector('.stepper[data-num=w] input') || {}).value,
      px: (document.querySelector('.stepper[data-num=px] input') || {}).value,
      py: (document.querySelector('.stepper[data-num=py] input') || {}).value,
      scale: (document.querySelector('#scaleSeg button[aria-pressed=true]') || {dataset:{}}).dataset.v
    };
  }

  function applySettings(s){
    if (!s) return;
    const safe = fn => { try { fn(); } catch (e) { console.warn("테마 항목 건너뜀:", e); } };
    if (s.colors){ Object.keys(COLORS).forEach(k => { if (s.colors[k]) COLORS[k] = s.colors[k]; }); }
    else { // 옛 프리셋 호환
      if (s.bg) COLORS["--bg"] = s.bg;
      if (s.fg) COLORS["--fg"] = s.fg;
      (s.hl||[]).forEach((v,i)=>{ if(v) COLORS["--hl"+(i+1)] = v; });
      (s.ac||[]).forEach((v,i)=>{ if(v) COLORS["--ac"+(i+1)] = v; });
      (s.qt||[]).forEach((v,i)=>{ if(v) COLORS["--qt"+(i+1)] = v; });
    }
    safe(() => { applyColorVars(); refreshSwatches(); });
    safe(() => { if (s.font) setFont(s.font); });
    const num = (k, v) => { if (v != null && v !== "" && stepperSet[k]) stepperSet[k](v); };
    ["tfs","sfs","fs","lh","ls","pg","w","px","py","hs","gapt","gaps","srcgap"]
      .forEach(k => safe(() => num(k, s[k])));
    safe(() => { if (s.tfw) setTWeight(s.tfw); });
    safe(() => { if (s.sfw) setSWeight(s.sfw); });
    safe(() => { if (s.align) setAlign(s.align); });
    safe(() => { if (s.wrap) setWrap(s.wrap); });
    safe(() => { if (s.ratio) setRatio(s.ratio); });
    safe(() => { if (s.scale) setScale(s.scale); });
    safe(() => { if (s.bfw) setBWeight(s.bfw); });
    safe(() => { if (s.auto) setAuto(s.auto); });
    safe(fit);
  }

  function renderPresets(){
    const list = loadPresets();
    const box = $("#presetList");
    box.innerHTML = "";
    list.forEach((p, i) => {
      const row = document.createElement("div");
      row.className = "preset";
      const name = document.createElement("button");
      name.className = "pname"; name.type = "button"; name.textContent = p.name;
      name.addEventListener("click", () => { applySettings(p.data); toast("'" + p.name + "' 적용됨"); });
      const del = document.createElement("button");
      del.className = "pdel"; del.type = "button"; del.textContent = "삭제";
      del.addEventListener("click", () => {
        const cur = loadPresets(); cur.splice(i, 1); savePresets(cur); renderPresets();
        toast("삭제됨");
      });
      row.append(name, del);
      box.append(row);
    });
  }

  $("#presetSave").addEventListener("click", () => {
    const name = $("#presetName").value.trim();
    if (!name) return toast("테마 이름을 입력해 주세요");
    const list = loadPresets();
    const idx = list.findIndex(p => p.name === name);
    const entry = { name, data: currentSettings() };
    if (idx >= 0) list[idx] = entry; else list.push(entry);
    savePresets(list);
    $("#presetName").value = "";
    renderPresets();
    toast(idx >= 0 ? "'" + name + "' 덮어씀" : "'" + name + "' 저장됨");
  });
  renderPresets();

  /* ── 탭 전환 ── */
  const tabs = [...document.querySelectorAll(".tab")];
  const panels = [...document.querySelectorAll(".tabpanel")];
  function showTab(name){
    tabs.forEach(t => t.setAttribute("aria-selected", String(t.dataset.tab === name)));
    panels.forEach(p => { p.hidden = p.dataset.tab !== name; });
  }
  tabs.forEach(t => t.addEventListener("click", () => showTab(t.dataset.tab)));
  showTab("content");

  /* ── 시작 상태 ── */
  applyColorVars();
  refreshSwatches();
  setVar("--ff", '"Pretendard JP","Pretendard",sans-serif');
  document.documentElement.style.setProperty("--uiff", '"Pretendard JP","Pretendard",sans-serif');
  setVar("--ta", "left");
  setVar("--wb", "keep-all");
  setVar("--tfs", "29px");
  setVar("--tfw", "700");
  setVar("--sfs", "18px");
  setVar("--sfw", "500");
  setVar("--srcgap", "20px");
  setVar("--gapt", "15px");
  setVar("--gaps", "20px");
  setVar("--bfw", "400");
  setVar("--hs", "100");
  setMsgPreset("imessage");

  sync();
  if (typeof refreshBubbles === "function") refreshBubbles();

  /* ── 모바일 키보드 대응 ── */
  const vv = window.visualViewport;
  function adjustPad(){
    if (!vv) return;
    if (window.matchMedia("(min-width:900px)").matches) {   // 2단에서는 여백 불필요
      document.body.style.paddingBottom = "0px";
      return;
    }
    const gap = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
    document.body.style.paddingBottom = (gap > 60 ? gap + 20 : 20) + "px";
  }
  if (vv){
    vv.addEventListener("resize", adjustPad);
    vv.addEventListener("scroll", adjustPad);
    adjustPad();
  }
  const focusables = [titleIn, subIn, srcTitle, srcAuthor, editor, $("#presetName"), $("#fname"), $("#hexInput")].filter(Boolean);
  focusables.forEach(el => {
    el.addEventListener("focus", () => {
      setTimeout(() => {
        adjustPad();
        try { el.scrollIntoView({ block: "center" }); } catch (e) { el.scrollIntoView(); }
      }, 100);
    });
    el.addEventListener("blur", () => setTimeout(adjustPad, 100));
  });
})();
</script>
</body>
</html>
